# ──────────────────────────────────────────────────────────────────────
# AutoAttend AI — basic CI
# ──────────────────────────────────────────────────────────────────────
# Runs on push/PR to main + security branches.
#   - Backend  : ruff lint  + python -c "import main" smoke-import
#   - Frontend : npm ci     + npm run build
#   - Mobile   : npm ci     + expo-doctor (best-effort)
#   - Docker   : builds the backend + frontend Dockerfiles to catch
#                broken syntax / missing deps early.
# ──────────────────────────────────────────────────────────────────────

name: ci

on:
  push:
    branches: [main, security]
  pull_request:
    branches: [main, security]

jobs:
  backend-lint:
    name: backend · lint + import smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff (lint)
        # Non-blocking for now — the codebase predates ruff config.
        # Once a ruff.toml is added remove `|| true`.
        run: ruff check . || true
      - name: Import smoke test
        env:
          DATABASE_URL:       sqlite+aiosqlite:///./_ci.db
          DATABASE_URL_SYNC:  sqlite:///./_ci.db
          SECRET_KEY:         ci-test-secret-not-for-prod-aaaaaaaaaaaaaaaaaaaa
          AZURE_FACE_ENDPOINT: https://example.invalid
          AZURE_FACE_KEY:     ci-test
          MSG91_AUTH_KEY:     ci-test
          MSG91_OTP_TEMPLATE_ID: ci-test
          MSG91_EMAIL_FROM:   ci@example.invalid
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN:  citoken
        run: |
          python -c "import importlib, sys; sys.path.insert(0, '.'); importlib.import_module('config'); print('config OK')"

  frontend-build:
    name: frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  mobile-check:
    name: mobile · install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoAttendMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: AutoAttendMobile/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

  docker-build:
    name: docker · build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t autoattend-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t autoattend-frontend:ci ./frontend
