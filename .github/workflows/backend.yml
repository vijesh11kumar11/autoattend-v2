# ──────────────────────────────────────────────────────────────────────
# Backend CI — lint (ruff), format check (black), and the pytest suite
# against a real PostgreSQL service (matching production semantics).
# ──────────────────────────────────────────────────────────────────────
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    name: ruff + black + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoattend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # ── Database (sync URL drives the test DB derivation in conftest) ──
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autoattend
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/autoattend
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoattend_test
      # ── Minimal required secrets (dummy values, never real) ───────────
      SECRET_KEY: ci-test-secret-not-for-prod-aaaaaaaaaaaaaaaaaaaa
      AZURE_FACE_ENDPOINT: https://example.invalid
      AZURE_FACE_KEY: ci-test
      MSG91_AUTH_KEY: ci-test
      MSG91_OTP_TEMPLATE_ID: ci-test
      MSG91_EMAIL_FROM: ci@example.invalid
      TWILIO_ACCOUNT_SID: ACtest
      TWILIO_AUTH_TOKEN: citoken
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest
        run: pytest tests/ -q
